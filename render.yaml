services:
  - type: web
    name: case-manager-validator
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_API_ONLY
        value: "true"
      - key: APP_ALLOWED_ORIGINS
        value: "https://jessfabian.github.io"
